name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm run install:ci || npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Test
        run: npm test
        continue-on-error: true
      - name: Ensure no secret filenames staged
        run: |
          set -e
          if git ls-files | grep -Ei '\.env$|\.pem$|service-account|google-services\.json|\.(p8)$'; then
            echo "Refusing secret-like paths in git" >&2
            exit 1
          fi
          echo "OK: no obvious secret filenames tracked"
